<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 30px 16px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .todo-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 28px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 24px;
        }

        #currentUser {
            font-size: 24px;
            line-height: 1.3;
        }

        .logout-btn {
            padding: 9px 14px;
            border: 1px solid #dc2626;
            border-radius: 7px;
            background: white;
            color: #dc2626;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        .todo-form,
        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input {
            min-width: 0;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        #add,
        #edit {
            background: #2563eb;
            color: white;
        }

        #add:hover,
        #edit:hover {
            background: #1d4ed8;
        }

        #deleteAll {
            background: #fee2e2;
            color: #b91c1c;
        }

        #deleteAll:hover {
            background: #fecaca;
        }

        .list-title {
            margin: 24px 0 12px;
            font-size: 18px;
        }

        #display {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #display li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            background: #fafafa;
        }

        #display li b {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
            font-weight: 500;
        }

        #display li button:first-of-type {
            background: #e0e7ff;
            color: #3730a3;
        }

        #display li button:last-of-type {
            background: #fee2e2;
            color: #b91c1c;
        }

        #display:empty::after {
            content: "No tasks added yet.";
            padding: 25px;
            text-align: center;
            color: #6b7280;
            border: 1px dashed #d1d5db;
            border-radius: 9px;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px 10px;
            }

            .todo-container {
                padding: 20px 14px;
                border-radius: 12px;
            }

            .top-bar {
                align-items: flex-start;
            }

            #currentUser {
                font-size: 19px;
            }

            .todo-form {
                flex-wrap: wrap;
            }

            .todo-form input {
                flex: 1 1 100%;
            }

            .todo-form button {
                flex: 1;
            }

            .search-section {
                display: block;
            }

            .search-section input {
                margin-bottom: 10px;
            }

            #deleteAll {
                width: 100%;
            }

            #display li {
                align-items: stretch;
                flex-wrap: wrap;
            }

            #display li b {
                flex: 1 1 100%;
            }

            #display li button {
                flex: 1;
            }
        }

        @media (max-width: 380px) {
            .top-bar {
                flex-direction: column;
            }

            .logout-btn {
                width: 100%;
            }

            .todo-form button {
                flex: 1 1 100%;
            }
        }
    </style>
</head>

<body>

    <main class="todo-container">
        <div class="top-bar">
            <h1 id="currentUser"></h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="todo-form">
            <input type="text" id="input" placeholder="Enter task name">
            <button onclick="todo()" id="add">Add Todo</button>
            <button style="display: none;" id="edit" onclick="updateTodo()">Update Todo</button>
        </div>

        <div class="search-section">
            <input type="text" placeholder="Search task..." id="search">
            <button id="deleteAll">Delete All</button>
        </div>

        <h2 class="list-title">My Tasks</h2>

        <ul id="display"></ul>
    </main>

    <script src="todo.js"></script>
</body>

</html>
